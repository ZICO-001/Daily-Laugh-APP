<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./ASS7.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Dancing+Script:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./ASS7.CSS" />
    <title>DAILY-LAUGH APP</title>
  </head>
  <body>
    <section class="wrapper">
      <div class="head">
        <h3>Daily Laugh</h3>
        <h1>Kill your <br /><span>boredom.</span></h1>
        <p>pick your mood - we'll handle the rest</p>
      </div>
      <div class="mood-container">
        <h5>HOW BORED ARE YOU RIGHT NOW?</h5>
        <div class="mood">
          <div>
            <img src="./happiness.png" alt="" width="20px" />
            <p>Not really</p>
            <p>JUST BROWSING</p>
          </div>
          <div>
            <img src="./bored.png" alt="" width="20px" />
            <p>A little</p>
            <p>COULD USE A LAUGH</p>
          </div>
          <div>
            <img src="./face.png" alt="" width="20px" />
            <p>pretty bored</p>
            <p>NOTHING GOING ON</p>
          </div>
          <div>
            <img src="./dizzy.png" alt="" width="20px" />
            <p>Dying here</p>
            <p>FULL COMEDY MODE</p>
          </div>
        </div>
      </div>

      <div class="joke-viewport">
        <p id="joke-text">pick a mood above then hit the button</p>
      </div>
      <button class="btn" id="btn">
        <img src="./very-happy.png" alt="" width="40px" height="40px" />
      </button>
    </section>
  </body>
</html>
